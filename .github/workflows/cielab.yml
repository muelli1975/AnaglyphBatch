name: Build updated CIELab tool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cielab.yml']
  pull_request:
    paths: ['.github/workflows/cielab.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the shared native tool source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: muelli1975/AnaChroma
          ref: f8095260736eee56159d66728e95c8f31c447c32
          path: native-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native build and validation dependencies
        run: python -m pip install numpy==2.3.5 Pillow==12.3.0 cmake==4.4.4 pytest==9.1.1
      - name: Compile native CIELab and bundle corresponding sources
        working-directory: native-source
        run: python scripts/build_cielab.py
      - name: Verify against the original Batch 1.0 executable
        working-directory: native-source
        run: python scripts/compare_cielab.py
      - name: Check real computation and Unicode paths
        working-directory: native-source
        run: python scripts/smoke_cielab.py
      - name: Test native pipeline against lossless reference samples
        working-directory: native-source
        run: python -m pytest -q tests/test_cielab_native.py
      - name: Archive updated tool with matching sources and licenses
        working-directory: native-source
        run: python scripts/archive_cielab.py windows-2022
      - name: Upload updated CIELab tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CIELab-windows-2022
          path: native-source/dist/CIELab-windows-2022.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload lossless comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CIELab-reference-comparison
          path: |
            native-source/build/cielab-comparison/*.json
            native-source/build/cielab-comparison/*.png
          if-no-files-found: warn
          retention-days: 14
